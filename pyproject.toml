[project]
name = "tagdoc"
version = "0.1.0"
description = "Describes a document: its title, kind, date, authors and the people it names (with copies of their cards), written into the PDF as medRDS says (XMP and the information dictionary) or into a sidecar; every decision reproducible."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "fre.ms", email = "fre.ms@fre.ms" }]
keywords = ["metadata", "xmp", "pdf", "vcard", "medrds", "records", "reproducible"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]
dependencies = [
  # the core the tools of docrepro share: configuration documents, errors, the command
  # line's manners, no network, the window's building blocks
  "doccor>=0.1",
  "pymupdf>=1.25,<2",
]

[project.optional-dependencies]
gui = ["pyside6-essentials>=6.8"]

[project.entry-points."docrepro.steps"]
# tagdoc is step 40 of docrepro; installing it puts it into the chain
tagdoc = "tagdoc.docrepro:TagdocAdapter"

[tool.uv.sources]
doccor = { git = "https://github.com/fre-ms/doccor", tag = "v0.1.0" }

[project.scripts]
tagdoc = "tagdoc.cli:main"

[project.urls]
Source = "https://github.com/fre-ms/tagdoc"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tagdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
